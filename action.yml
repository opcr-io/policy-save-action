name: "Policy Save"
description: "Save policy image to file or stdout"
author: "gert@d5s.io"
branding:
  icon: save
  color: blue
inputs:
  tag:
    description: "tag of local image to be saved"
    required: true
  file:
    description: "output file path"
    required: true
  verbosity:
    description: "verbosity level [info|error|debug|trace]"
    required: true
    default: error
runs:
  using: docker
  image: 'docker://ghcr.io/opcr-io/policy:0.4'
  entrypoint: /app/save.sh
